name: Collect official NSE historical index data
on:
  workflow_dispatch:
    inputs:
      index:
        description: NSE index name
        required: true
        default: NIFTY 50
      from_date:
        description: DD-MM-YYYY
        required: true
        default: 03-07-1990
      to_date:
        description: DD-MM-YYYY
        required: true
        default: 06-11-2026
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/nse_index_collector.py --index "${{ inputs.index }}" --from-date "${{ inputs.from_date }}" --to-date "${{ inputs.to_date }}"
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/nse-official
          git diff --cached --quiet || git commit -m "Collect official NSE historical index data"
          git push
