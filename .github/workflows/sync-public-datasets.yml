name: Sync public Indian market datasets
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone verified public datasets
        run: |
          git clone --depth 1 https://github.com/technovusin/nifty50-historical-data.git /tmp/nifty
          git clone --depth 1 https://github.com/technovusin/sensex-historical-data.git /tmp/sensex
          git clone --depth 1 https://github.com/kalilurrahman/NIFTY_50_STOCK_DATA.git /tmp/nifty-stocks
          rm -rf /tmp/nifty/.git /tmp/sensex/.git /tmp/nifty-stocks/.git
          mkdir -p index/indian-index/raw/github stocks/top-50/raw/github sources
          rm -rf index/indian-index/raw/github/nifty50-historical-data index/indian-index/raw/github/sensex-historical-data stocks/top-50/raw/github/NIFTY_50_STOCK_DATA
          cp -a /tmp/nifty index/indian-index/raw/github/nifty50-historical-data
          cp -a /tmp/sensex index/indian-index/raw/github/sensex-historical-data
          cp -a /tmp/nifty-stocks stocks/top-50/raw/github/NIFTY_50_STOCK_DATA
          { echo retrieved_utc: $(date -u +%FT%TZ); echo nifty50_commit: source-snapshot; echo sensex_commit: source-snapshot; echo nifty50_stocks_commit: source-snapshot; } > sources/LATEST_SNAPSHOT.txt
          find index/indian-index/raw/github stocks/top-50/raw/github -type f -print0 | sort -z | xargs -0 sha256sum > sources/SHA256SUMS.txt
      - name: Commit source-preserving snapshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index/indian-index/raw stocks/top-50/raw sources/LATEST_SNAPSHOT.txt sources/SHA256SUMS.txt
          git diff --cached --quiet || git commit -m 'Sync verified public market dataset snapshots'
          git push
